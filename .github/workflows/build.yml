# =============================================================================
# Build, test and release
#   push to main / PR  -> build + tests, upload the exe as an artifact
#   tag v*             -> the same, then publish a GitHub release
# =============================================================================

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TriageToolkit
          path: |
            build/TriageToolkit.exe
            build/checksums.json
            build/build_info.json

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TriageToolkit
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TriageToolkit.exe
            release/checksums.json
            release/build_info.json
          body: |
            ## Windows Forensic Triage Toolkit ${{ github.ref_name }}

            Download `TriageToolkit.exe`, copy it to the machine you want to examine (a USB stick works well) and double-click it. Windows will ask for administrator rights.

            **Verify:** `checksums.json` holds the SHA-256 of every embedded script. The app checks them itself before each module runs; you can compare against a local `.\build.ps1` of this tag.

            Requires Windows 10 or 11. Nothing to install.
